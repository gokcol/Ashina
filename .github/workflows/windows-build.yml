name: Windows build
# Builds MyPDF.exe for 64-bit Windows, packs it in a zip with the licenses,
# and builds the SkyPDF-<version>-Setup.exe installer with Inno Setup.
# Run it by hand (Actions → Windows build → Run workflow). The zip is a download
# on the run's page; name a release tag to also attach it to that release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        default: main
      release:
        description: Attach packages to this release tag (leave empty for a test build)
        default: ""
      architecture:
        description: Windows processor architecture
        type: choice
        options: [x64, arm64, both]
        default: both
permissions:
  contents: write
jobs:
  build:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'both' && '["x64","arm64"]' || inputs.architecture == 'arm64' && '["arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 75
    env:
      MYPDF_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          toolchain: ${{ matrix.arch == 'arm64' && '1.93.1-aarch64-pc-windows-msvc' || '1.93.1-x86_64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-${{ matrix.arch }}
          cache-on-failure: true
      - uses: actions/setup-python@v6
        if: matrix.arch == 'x64'
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned native build tooling
        if: matrix.arch == 'x64'
        run: python -m pip install cmake==3.31.6
      - name: Verify native build host
        shell: pwsh
        run: |
          $expected = if ($env:MYPDF_ARCH -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          if ((rustc -vV) -notcontains "host: $expected") { throw "Expected native Rust host $expected" }
          if ([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() -ine $env:MYPDF_ARCH) { throw 'PowerShell must run natively for DLL tests.' }
          cmake --version
      - name: Restore native translation runtime
        id: translation-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/translation/windows-${{ matrix.arch }}
          key: windows-translation-${{ matrix.arch }}-${{ hashFiles('native/translation-ct2/**', 'scripts/build-translation-windows.ps1') }}
      - name: Build native translation runtime
        if: steps.translation-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $options = @{ Architecture = $env:MYPDF_ARCH }
          if ($env:MYPDF_ARCH -eq 'arm64') {
            $options.Generator = 'auto'
            $options.Toolset = 'ClangCL'
          }
          & ./scripts/build-translation-windows.ps1 @options
      - name: Verify native translation runtime and packaging
        shell: pwsh
        run: |
          & ./scripts/test-translation-runtime.ps1 -Architecture $env:MYPDF_ARCH
          & ./scripts/test-translation-packaging.ps1 -Architecture $env:MYPDF_ARCH
      - name: Save verified translation runtime
        if: steps.translation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/translation/windows-${{ matrix.arch }}
          key: ${{ steps.translation-cache.outputs.cache-primary-key }}
      - name: Build optimized translation test
        shell: pwsh
        run: '& ./scripts/test-translation-smoke.ps1 -Stage Build -Architecture $env:MYPDF_ARCH'
      - name: Download and verify approved translation model
        timeout-minutes: 12
        shell: pwsh
        run: '& ./scripts/test-translation-smoke.ps1 -Stage Download -Architecture $env:MYPDF_ARCH'
      - name: Verify offline translation and repeated engine shutdown
        timeout-minutes: 5
        shell: pwsh
        run: '& ./scripts/test-translation-smoke.ps1 -Stage Translate -Architecture $env:MYPDF_ARCH'
      - name: Restore offline OCR bundle
        id: ocr-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/ocr/windows-${{ matrix.arch }}
          key: windows-ocr-${{ matrix.arch }}-${{ hashFiles('scripts/build-ocr-windows.ps1', 'packaging/windows/ocr/**') }}
      - name: Build offline OCR runtime and language models
        if: steps.ocr-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: '& ./scripts/build-ocr-windows.ps1 -Architecture $env:MYPDF_ARCH'
      - name: Save verified OCR bundle
        if: steps.ocr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/ocr/windows-${{ matrix.arch }}
          key: ${{ steps.ocr-cache.outputs.cache-primary-key }}
      - run: cargo build --locked --release --bin mypdf --example ocr_smoke
      - name: Check native executable architecture
        shell: pwsh
        run: '& ./scripts/test-windows-architecture.ps1 -Path target/release/mypdf.exe -Architecture $env:MYPDF_ARCH'
      - name: Test ARM64 app logic
        if: matrix.arch == 'arm64'
        run: cargo test --locked --no-fail-fast
      - name: Verify real offline OCR on a scanned PDF
        shell: pwsh
        run: |
          # Exercise Unicode/spaces in the installed location as well as recognition.
          & ./scripts/copy-ocr-runtime.ps1 -Architecture $env:MYPDF_ARCH -DestinationDirectory "$pwd/artifacts/OCR Türkçe review"
          $env:MYPDF_OCR_RUNTIME_DIR = "$pwd/artifacts/OCR Türkçe review/ocr"
          & ./target/release/examples/ocr_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Real OCR smoke test failed.' }
      - name: Pack
        shell: pwsh
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          # Named like the release (v3.1.2 → SkyPDF-3.1.2-…), or by the crate version.
          $version = if ($env:RELEASE) { $env:RELEASE.TrimStart('v') } else {
            (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          }
          $name = "SkyPDF-$version-windows-$env:MYPDF_ARCH"
          New-Item -ItemType Directory -Path "pack\SkyPDF" | Out-Null
          Copy-Item target\release\mypdf.exe pack\SkyPDF\MyPDF.exe
          Copy-Item -Path @('README.md', 'FEATURES.md', 'LICENSE-MIT', 'LICENSE-APACHE', 'THIRD_PARTY_NOTICES.md') -Destination 'pack\SkyPDF\'
          & ./scripts/copy-translation-runtime.ps1 -Architecture $env:MYPDF_ARCH -DestinationDirectory "$pwd\pack\SkyPDF"
          & ./scripts/copy-ocr-runtime.ps1 -Architecture $env:MYPDF_ARCH -DestinationDirectory "$pwd\pack\SkyPDF"
          Compress-Archive -Path pack\SkyPDF -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii -NoNewline "$name.zip.sha256"
          "NAME=$name" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          $setup = if ($env:MYPDF_ARCH -eq 'arm64') { "SkyPDF-$version-Setup-arm64" } else { "SkyPDF-$version-Setup" }
          "SETUP=$setup" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
      - name: Installer
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler not found.' }
          # The installer carries the same product version as MyPDF.exe.
          $crate = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $architecture = if ($env:MYPDF_ARCH -eq 'arm64') { 'arm64' } else { 'x64compatible' }
          & $iscc "/DAppVersion=$crate" "/DAppArchitecture=$architecture" "/DSource=$pwd\pack\SkyPDF" "/O$pwd" "/F$env:SETUP" packaging\windows\MyPDF.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "$env:SETUP.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:SETUP.exe" | Out-File -Encoding ascii -NoNewline "$env:SETUP.exe.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.zip
            ${{ env.NAME }}.zip.sha256
            ${{ env.SETUP }}.exe
            ${{ env.SETUP }}.exe.sha256
      - name: Attach to the release
        if: ${{ inputs.release != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release upload $env:RELEASE "$env:NAME.zip" "$env:NAME.zip.sha256" "$env:SETUP.exe" "$env:SETUP.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
